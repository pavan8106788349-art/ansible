
- name: demo on filters
  hosts: local
  connection: local

  vars:
    topics: "linux,shell,ansible,terraform"
    app_tags:
      Name: ansible
      project: roboshop
      component: catalogue

  tasks:
    - name: greeting
      ansible.builtin.debug:
        msg: "Hi Sivakumar, {{ GREETING | default('Good Morning') }}"

    - name: convert string to list
      ansible.builtin.debug:
        msg: "{{ topics | split(',') }}"

    - name: convert map to list
      ansible.builtin.debug:
        msg: "{{ app_tags | dict2items }}"
   
